<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposals | Soft System Solutions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #0f0f1a;
            color: #ffffff;
        }

        .navbar {
            background: #1a1a2e;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid rgba(245,158,11,0.3);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            color: #f59e0b;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid rgba(245,158,11,0.3);
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn:hover, .nav-btn.active {
            background: #f59e0b;
            color: #0f0f1a;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(245,158,11,0.2);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #f59e0b;
        }

        .stat-label {
            font-size: 13px;
            color: #a0a0c0;
            margin-top: 5px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-primary {
            background: #f59e0b;
            color: #0f0f1a;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #f59e0b;
            color: #f59e0b;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input, .search-box select {
            padding: 12px 15px;
            background: #1a1a2e;
            border: 1px solid rgba(245,158,11,0.3);
            border-radius: 8px;
            color: white;
        }

        .search-box input { width: 250px; }

        .table-container {
            overflow-x: auto;
            background: #1a1a2e;
            border-radius: 16px;
            border: 1px solid rgba(245,158,11,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 15px;
            background: rgba(245,158,11,0.1);
            color: #f59e0b;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        tr:hover td {
            background: rgba(245,158,11,0.05);
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .status-draft { background: #64748b; color: white; }
        .status-sent { background: #3b82f6; color: white; }
        .status-viewed { background: #8b5cf6; color: white; }
        .status-accepted { background: #10b981; color: white; }
        .status-rejected { background: #ef4444; color: white; }

        .amount {
            font-weight: bold;
            color: #f59e0b;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 550px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #f59e0b;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #a0a0c0;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #0f0f1a;
            border: 1px solid rgba(245,158,11,0.3);
            border-radius: 8px;
            color: white;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            display: none;
            z-index: 1000;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #a0a0c0;
        }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; text-align: center; }
            .action-bar { flex-direction: column; align-items: stretch; }
            .search-box { flex-direction: column; }
            .search-box input { width: 100%; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Soft System<span>Solutions</span></div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='dashboard.html'">📊 Dashboard</button>
            <button class="nav-btn" onclick="window.location.href='crm.html'">📞 CRM</button>
            <button class="nav-btn" onclick="window.location.href='search.html'">🔍 Business Search</button>
            <button class="nav-btn active">📄 Proposals</button>
            <button class="nav-btn" onclick="window.location.href='whatsapp.html'">💬 WhatsApp</button>
            <button class="nav-btn" onclick="window.location.href='settings.html'">⚙️ Settings</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="stats-grid" id="statsGrid"></div>

        <div class="action-bar">
            <div><button class="btn-primary" onclick="openAddProposalModal()">+ New Proposal</button></div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by contact or title..." onkeyup="loadProposals()">
                <select id="statusFilter" onchange="loadProposals()">
                    <option value="all">All Status</option>
                    <option value="draft">Draft</option>
                    <option value="sent">Sent</option>
                    <option value="viewed">Viewed</option>
                    <option value="accepted">Accepted</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Contact</th><th>Title</th><th>Amount</th><th>Status</th><th>Date</th><th>Actions</th></tr>
                </thead>
                <tbody id="proposalsTableBody">
                    <tr><td colspan="6" class="empty-state">Loading proposals...<\/td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Proposal Modal -->
    <div id="proposalModal" class="modal">
        <div class="modal-content">
            <h3>New Proposal</h3>
            <input type="hidden" id="proposalId">
            <div class="form-group"><label>Select Contact *</label><select id="proposalContactId"></select></div>
            <div class="form-group"><label>Title *</label><input type="text" id="proposalTitle"></div>
            <div class="form-group"><label>Description</label><textarea id="proposalDescription" rows="4"></textarea></div>
            <div class="form-group"><label>Amount (GHS)</label><input type="number" id="proposalAmount"></div>
            <div class="form-group"><label>Status</label><select id="proposalStatus"><option value="draft">📝 Draft</option><option value="sent">📤 Sent</option><option value="viewed">👁️ Viewed</option><option value="accepted">✅ Accepted</option><option value="rejected">❌ Rejected</option></select></div>
            <div class="modal-buttons"><button class="btn-primary" onclick="saveProposal()">Save</button><button class="btn-secondary" onclick="closeModal('proposalModal')">Cancel</button></div>
        </div>
    </div>

    <!-- Status Modal -->
    <div id="statusModal" class="modal">
        <div class="modal-content">
            <h3>Update Status</h3>
            <input type="hidden" id="statusProposalId">
            <div class="form-group"><label>Status</label><select id="updateStatus"><option value="draft">📝 Draft</option><option value="sent">📤 Sent</option><option value="viewed">👁️ Viewed</option><option value="accepted">✅ Accepted</option><option value="rejected">❌ Rejected</option></select></div>
            <div class="form-group"><label>Response Notes</label><textarea id="responseNotes" rows="3"></textarea></div>
            <div class="modal-buttons"><button class="btn-primary" onclick="updateProposalStatus()">Update</button><button class="btn-secondary" onclick="closeModal('statusModal')">Cancel</button></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API_URL = '';
        let token = localStorage.getItem('token');
        let contacts = [];
        let proposals = [];
        
        if (!token) window.location.href = 'index.html';

        async function apiCall(endpoint, options = {}) {
            const response = await fetch(API_URL + endpoint, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...options.headers
                }
            });
            return response.json();
        }

        async function loadData() {
            await loadProposals();
            contacts = await apiCall('/api/contacts');
        }

        async function loadProposals() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            
            proposals = await apiCall('/api/proposals');
            
            let filtered = proposals;
            if (search) filtered = filtered.filter(p => p.contact_name?.toLowerCase().includes(search) || p.title?.toLowerCase().includes(search));
            if (statusFilter !== 'all') filtered = filtered.filter(p => p.status === statusFilter);
            
            renderTable(filtered);
            updateStats();
        }

        function renderTable(list) {
            const tbody = document.getElementById('proposalsTableBody');
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No proposals found. Click "+ New Proposal" to create one.<\/td></tr>';
                return;
            }
            tbody.innerHTML = list.map(p => `
                <tr>
                    <td><strong>${escapeHtml(p.contact_name)}</strong><br><small style="color:#64748b;">${escapeHtml(p.contact_company || '')}</small></td>
                    <td>${escapeHtml(p.title)}</span></td>
                    <td class="amount">GHS ${(p.amount || 0).toLocaleString()}</span></td>
                    <td><span class="status status-${p.status}">${getStatusText(p.status)}</span></td>
                    <td>${formatDate(p.sent_date)}</span></td>
                    <td class="action-buttons">
                        <button class="btn-secondary" style="padding:6px 12px; margin-right:5px;" onclick="openStatusModal(${p.id})">📝 Status</button>
                        <button class="btn-secondary" style="padding:6px 12px; background:#ef4444; border-color:#ef4444;" onclick="deleteProposal(${p.id})">🗑️ Delete</button>
                    </span></td>
            </tr>`).join('');
        }

        function getStatusText(s) { return { draft:'📝 Draft', sent:'📤 Sent', viewed:'👁️ Viewed', accepted:'✅ Accepted', rejected:'❌ Rejected' }[s] || s; }

        function updateStats() {
            const total = proposals.length;
            const accepted = proposals.filter(p => p.status === 'accepted').length;
            const pending = proposals.filter(p => p.status === 'sent' || p.status === 'viewed').length;
            const totalValue = proposals.reduce((s,p) => s + (p.status === 'accepted' ? (p.amount || 0) : 0), 0);
            document.getElementById('statsGrid').innerHTML = `<div class="stat-card"><div class="stat-number">${total}</div><div class="stat-label">Total</div></div><div class="stat-card"><div class="stat-number">${accepted}</div><div class="stat-label">Accepted</div></div><div class="stat-card"><div class="stat-number">${pending}</div><div class="stat-label">Pending</div></div><div class="stat-card"><div class="stat-number">GHS ${totalValue.toLocaleString()}</div><div class="stat-label">Value</div></div>`;
        }

        function openAddProposalModal() {
            const select = document.getElementById('proposalContactId');
            select.innerHTML = '<option value="">-- Select Contact --</option>' + contacts.map(c => `<option value="${c.id}">${escapeHtml(c.name)}${c.company ? ' - ' + c.company : ''}</option>`).join('');
            document.getElementById('proposalId').value = '';
            document.getElementById('proposalTitle').value = '';
            document.getElementById('proposalDescription').value = '';
            document.getElementById('proposalAmount').value = '';
            document.getElementById('proposalStatus').value = 'draft';
            document.getElementById('proposalModal').style.display = 'flex';
        }

        async function saveProposal() {
            const id = document.getElementById('proposalId').value;
            const data = {
                contact_id: parseInt(document.getElementById('proposalContactId').value),
                title: document.getElementById('proposalTitle').value,
                description: document.getElementById('proposalDescription').value,
                amount: parseFloat(document.getElementById('proposalAmount').value) || 0,
                status: document.getElementById('proposalStatus').value
            };
            if (!data.contact_id || !data.title) { showToast('Select contact and enter title', 'error'); return; }
            
            const result = await apiCall('/api/proposals', { method: 'POST', body: JSON.stringify(data) });
            if (result.success) { closeModal('proposalModal'); loadProposals(); showToast('Proposal created!', 'success'); }
            else showToast('Error saving proposal', 'error');
        }

        function openStatusModal(id) { const p = proposals.find(p => p.id === id); if (p) { document.getElementById('statusProposalId').value = id; document.getElementById('updateStatus').value = p.status; document.getElementById('responseNotes').value = p.response_notes || ''; document.getElementById('statusModal').style.display = 'flex'; } }
        
        async function updateProposalStatus() {
            const id = parseInt(document.getElementById('statusProposalId').value);
            const result = await apiCall(`/api/proposals/${id}/status`, { method: 'PUT', body: JSON.stringify({ status: document.getElementById('updateStatus').value, response_notes: document.getElementById('responseNotes').value }) });
            if (result.success) { closeModal('statusModal'); loadProposals(); showToast('Status updated!', 'success'); }
        }

        async function deleteProposal(id) { if (confirm('Delete this proposal?')) { await apiCall(`/api/proposals/${id}`, { method: 'DELETE' }); loadProposals(); showToast('Deleted!', 'success'); } }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function showToast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.style.backgroundColor = type === 'error' ? '#ef4444' : '#10b981'; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
        function formatDate(d) { if (!d) return '-'; const date = new Date(d); return `${date.getDate()}/${date.getMonth()+1}/${date.getFullYear()}`; }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
        
        loadData();
    </script>
</body>
</html>
