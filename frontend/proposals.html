<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposals | Soft System Solutions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0f0f1a; color: #ffffff; }
        .navbar { background: #1a1a2e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border-bottom: 1px solid rgba(245,158,11,0.3); }
        .logo { font-size: 22px; font-weight: bold; }
        .logo span { color: #f59e0b; }
        .nav-buttons { display: flex; gap: 15px; flex-wrap: wrap; }
        .nav-btn { background: transparent; border: 1px solid rgba(245,158,11,0.3); color: white; padding: 8px 20px; border-radius: 8px; cursor: pointer; }
        .nav-btn:hover { background: #f59e0b; color: #0f0f1a; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1a1a2e; padding: 20px; border-radius: 16px; text-align: center; border: 1px solid rgba(245,158,11,0.2); }
        .stat-number { font-size: 32px; font-weight: bold; color: #f59e0b; }
        .stat-label { font-size: 13px; color: #a0a0c0; margin-top: 5px; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
        .btn-primary { background: #f59e0b; color: #0f0f1a; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-secondary { background: transparent; border: 1px solid #f59e0b; color: #f59e0b; padding: 12px 24px; border-radius: 8px; cursor: pointer; }
        .search-box { display: flex; gap: 10px; }
        .search-box input, .search-box select { padding: 12px 15px; background: #1a1a2e; border: 1px solid rgba(245,158,11,0.3); border-radius: 8px; color: white; }
        .search-box input { width: 250px; }
        .table-container { overflow-x: auto; background: #1a1a2e; border-radius: 16px; border: 1px solid rgba(245,158,11,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; background: rgba(245,158,11,0.1); color: #f59e0b; }
        td { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        tr:hover td { background: rgba(245,158,11,0.05); }
        .status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .status-draft { background: #64748b; color: white; }
        .status-sent { background: #3b82f6; color: white; }
        .status-viewed { background: #8b5cf6; color: white; }
        .status-accepted { background: #10b981; color: white; }
        .status-rejected { background: #ef4444; color: white; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1a1a2e; border-radius: 20px; padding: 30px; width: 90%; max-width: 550px; max-height: 80vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 20px; color: #f59e0b; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #a0a0c0; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: #0f0f1a; border: 1px solid rgba(245,158,11,0.3); border-radius: 8px; color: white; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #10b981; color: white; padding: 12px 24px; border-radius: 8px; display: none; z-index: 1000; }
        .empty-state { text-align: center; padding: 60px; color: #a0a0c0; }
        .amount { font-weight: bold; color: #f59e0b; }
        @media (max-width: 768px) { .navbar { flex-direction: column; } .action-bar { flex-direction: column; } .search-box { flex-direction: column; } .search-box input { width: 100%; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Soft System<span>Solutions</span></div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='dashboard.html'">📊 Dashboard</button>
            <button class="nav-btn" onclick="window.location.href='crm.html'">📞 CRM</button>
            <button class="nav-btn" onclick="window.location.href='search.html'">🔍 Business Search</button>
            <button class="nav-btn" style="background:#f59e0b; color:#0f0f1a;">📄 Proposals</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="stats-grid" id="statsGrid"></div>
        <div class="action-bar">
            <div><button class="btn-primary" onclick="openAddProposalModal()">+ New Proposal</button><button class="btn-secondary" onclick="exportProposals()">📥 Export CSV</button></div>
            <div class="search-box"><input type="text" id="searchInput" placeholder="Search..." onkeyup="loadProposals()"><select id="statusFilter" onchange="loadProposals()"><option value="all">All Status</option><option value="draft">Draft</option><option value="sent">Sent</option><option value="viewed">Viewed</option><option value="accepted">Accepted</option><option value="rejected">Rejected</option></select></div>
        </div>
        <div class="table-container"><table><thead><tr><th>Contact</th><th>Title</th><th>Amount</th><th>Status</th><th>Date</th><th>Response</th><th>Actions</th></tr></thead><tbody id="proposalsTableBody"><tr><td colspan="7" class="empty-state">Loading...</td></tr></tbody></table></div>
    </div>

    <div id="proposalModal" class="modal"><div class="modal-content"><h3 id="modalTitle">New Proposal</h3><input type="hidden" id="proposalId"><div class="form-group"><label>Contact *</label><select id="proposalContactId"></select></div><div class="form-group"><label>Title *</label><input type="text" id="proposalTitle"></div><div class="form-group"><label>Description</label><textarea id="proposalDescription" rows="4"></textarea></div><div class="form-group"><label>Amount (GHS)</label><input type="number" id="proposalAmount"></div><div class="form-group"><label>Status</label><select id="proposalStatus"><option value="draft">📝 Draft</option><option value="sent">📤 Sent</option><option value="viewed">👁️ Viewed</option><option value="accepted">✅ Accepted</option><option value="rejected">❌ Rejected</option></select></div><div class="modal-buttons"><button class="btn-primary" onclick="saveProposal()">Save</button><button class="btn-secondary" onclick="closeModal('proposalModal')">Cancel</button></div></div></div>

    <div id="statusModal" class="modal"><div class="modal-content"><h3>Update Status</h3><input type="hidden" id="statusProposalId"><div class="form-group"><label>Status</label><select id="updateStatus"><option value="draft">📝 Draft</option><option value="sent">📤 Sent</option><option value="viewed">👁️ Viewed</option><option value="accepted">✅ Accepted</option><option value="rejected">❌ Rejected</option></select></div><div class="form-group"><label>Response Notes</label><textarea id="responseNotes" rows="3"></textarea></div><div class="modal-buttons"><button class="btn-primary" onclick="updateProposalStatus()">Update</button><button class="btn-secondary" onclick="closeModal('statusModal')">Cancel</button></div></div></div>

    <div id="viewModal" class="modal"><div class="modal-content"><h3>Proposal Details</h3><div id="viewDetails"></div><div class="modal-buttons"><button class="btn-secondary" onclick="closeModal('viewModal')">Close</button></div></div></div>
    <div id="toast" class="toast"></div>

    <script>
        let proposals = [], contacts = [], token = localStorage.getItem('token');
        if (!token) window.location.href = 'index.html';

        function loadProposals() {
            proposals = JSON.parse(localStorage.getItem('sss_proposals') || '[]');
            contacts = JSON.parse(localStorage.getItem('sss_contacts') || '[]');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            let filtered = proposals.filter(p => (!search || p.contactName.toLowerCase().includes(search) || p.title.toLowerCase().includes(search)) && (statusFilter === 'all' || p.status === statusFilter));
            renderTable(filtered);
            updateStats();
        }

        function renderTable(list) {
            const tbody = document.getElementById('proposalsTableBody');
            if (!list.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No proposals found</td></tr>'; return; }
            tbody.innerHTML = list.map(p => `<tr><td><strong>${escapeHtml(p.contactName)}</strong><br><small>${escapeHtml(p.contactCompany || '')}</small></td><td>${escapeHtml(p.title)}</td><td class="amount">GHS ${(p.amount || 0).toLocaleString()}</td><td><span class="status status-${p.status}">${getStatusText(p.status)}</span></td><td>${formatDate(p.sentDate)}</td><td>${escapeHtml((p.responseNotes || '').substring(0, 50))}</td><td><button class="btn-secondary" style="padding:6px 12px;margin-right:5px;" onclick="viewProposal(${p.id})">View</button><button class="btn-secondary" style="padding:6px 12px;background:#3b82f6;" onclick="openStatusModal(${p.id})">Status</button><button class="btn-secondary" style="padding:6px 12px;background:#ef4444;" onclick="deleteProposal(${p.id})">Delete</button></td></tr>`).join('');
        }

        function updateStats() {
            const total = proposals.length, accepted = proposals.filter(p => p.status === 'accepted').length, pending = proposals.filter(p => p.status === 'sent' || p.status === 'viewed').length, rejected = proposals.filter(p => p.status === 'rejected').length, totalValue = proposals.reduce((s,p) => s + (p.status === 'accepted' ? (p.amount || 0) : 0), 0);
            document.getElementById('statsGrid').innerHTML = `<div class="stat-card"><div class="stat-number">${total}</div><div class="stat-label">Total</div></div><div class="stat-card"><div class="stat-number">${accepted}</div><div class="stat-label">Accepted</div></div><div class="stat-card"><div class="stat-number">${pending}</div><div class="stat-label">Pending</div></div><div class="stat-card"><div class="stat-number">${rejected}</div><div class="stat-label">Rejected</div></div><div class="stat-card"><div class="stat-number">GHS ${totalValue.toLocaleString()}</div><div class="stat-label">Value</div></div>`;
        }

        function getStatusText(s) { return { draft:'📝 Draft', sent:'📤 Sent', viewed:'👁️ Viewed', accepted:'✅ Accepted', rejected:'❌ Rejected' }[s] || s; }
        
        function openAddProposalModal() {
            const select = document.getElementById('proposalContactId');
            select.innerHTML = '<option value="">-- Select Contact --</option>' + contacts.map(c => `<option value="${c.id}">${escapeHtml(c.name)}${c.company ? ' - ' + c.company : ''}</option>`).join('');
            const urlParams = new URLSearchParams(window.location.search);
            const contactId = urlParams.get('contact');
            if (contactId) select.value = contactId;
            document.getElementById('proposalId').value = ''; document.getElementById('proposalTitle').value = ''; document.getElementById('proposalDescription').value = ''; document.getElementById('proposalAmount').value = ''; document.getElementById('proposalStatus').value = 'draft';
            document.getElementById('proposalModal').style.display = 'flex';
        }

        function saveProposal() {
            const id = document.getElementById('proposalId').value, contactId = parseInt(document.getElementById('proposalContactId').value), title = document.getElementById('proposalTitle').value.trim();
            if (!contactId || !title) { showToast('Select contact and enter title', 'error'); return; }
            const contact = contacts.find(c => c.id === contactId);
            const pData = { contactId, contactName: contact.name, contactCompany: contact.company || '', contactEmail: contact.email || '', title, description: document.getElementById('proposalDescription').value, amount: document.getElementById('proposalAmount').value || 0, status: document.getElementById('proposalStatus').value, responseNotes: '', sentDate: new Date().toISOString() };
            let updated = [...proposals];
            if (id) { const idx = updated.findIndex(p => p.id == id); if (idx !== -1) updated[idx] = { ...updated[idx], ...pData, updatedAt: new Date().toISOString() }; }
            else { const newId = updated.length ? Math.max(...updated.map(p => p.id)) + 1 : 1; updated.push({ id: newId, ...pData, createdAt: new Date().toISOString() }); }
            localStorage.setItem('sss_proposals', JSON.stringify(updated));
            closeModal('proposalModal'); loadProposals(); showToast(id ? 'Updated!' : 'Created!', 'success');
        }

        function viewProposal(id) {
            const p = proposals.find(p => p.id === id);
            if (!p) return;
            document.getElementById('viewDetails').innerHTML = `<div><strong>Contact:</strong> ${escapeHtml(p.contactName)}<br><strong>Company:</strong> ${escapeHtml(p.contactCompany || '-')}<br><strong>Email:</strong> ${escapeHtml(p.contactEmail || '-')}</div><div style="margin-top:15px"><strong>Title:</strong> ${escapeHtml(p.title)}<br><strong>Amount:</strong> <span class="amount">GHS ${(p.amount || 0).toLocaleString()}</span><br><strong>Status:</strong> <span class="status status-${p.status}">${getStatusText(p.status)}</span></div><div style="margin-top:15px"><strong>Description:</strong><br><p style="color:#a0a0c0;">${escapeHtml(p.description || 'No description')}</p></div><div style="margin-top:15px"><strong>Response:</strong><br><p style="color:#a0a0c0;">${escapeHtml(p.responseNotes || 'No response yet')}</p></div>`;
            document.getElementById('viewModal').style.display = 'flex';
        }

        function openStatusModal(id) { const p = proposals.find(p => p.id === id); if (p) { document.getElementById('statusProposalId').value = id; document.getElementById('updateStatus').value = p.status; document.getElementById('responseNotes').value = p.responseNotes || ''; document.getElementById('statusModal').style.display = 'flex'; } }
        function updateProposalStatus() {
            const id = parseInt(document.getElementById('statusProposalId').value), idx = proposals.findIndex(p => p.id === id);
            if (idx !== -1) { proposals[idx].status = document.getElementById('updateStatus').value; proposals[idx].responseNotes = document.getElementById('responseNotes').value; proposals[idx].updatedAt = new Date().toISOString(); localStorage.setItem('sss_proposals', JSON.stringify(proposals)); closeModal('statusModal'); loadProposals(); showToast('Status updated!', 'success'); }
        }

        function deleteProposal(id) { if (confirm('Delete this proposal?')) { proposals = proposals.filter(p => p.id !== id); localStorage.setItem('sss_proposals', JSON.stringify(proposals)); loadProposals(); showToast('Deleted!', 'success'); } }
        function exportProposals() { if (!proposals.length) { showToast('No proposals', 'error'); return; } const csv = [['Contact','Company','Title','Amount','Status','Date','Response'], ...proposals.map(p => [p.contactName, p.contactCompany || '', p.title, p.amount, p.status, formatDate(p.sentDate), p.responseNotes || ''])].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n'); const blob = new Blob([csv], { type: 'text/csv' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `proposals_${new Date().toISOString().split('T')[0]}.csv`; a.click(); URL.revokeObjectURL(blob); showToast('Exported!', 'success'); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function showToast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.style.backgroundColor = type === 'error' ? '#ef4444' : '#10b981'; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
        function formatDate(d) { if (!d) return '-'; const date = new Date(d); return `${date.getDate()}/${date.getMonth()+1}/${date.getFullYear()}`; }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
        loadProposals();
    </script>
</body>
</html>
