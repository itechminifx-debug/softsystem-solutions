<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM | Soft System Solutions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #0f0f1a;
            color: #ffffff;
        }

        .navbar {
            background: #1a1a2e;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid rgba(245,158,11,0.3);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            color: #f59e0b;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid rgba(245,158,11,0.3);
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn:hover, .nav-btn.active {
            background: #f59e0b;
            color: #0f0f1a;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(245,158,11,0.2);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #f59e0b;
        }

        .stat-label {
            font-size: 13px;
            color: #a0a0c0;
            margin-top: 5px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-primary {
            background: #f59e0b;
            color: #0f0f1a;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #f59e0b;
            color: #f59e0b;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            padding: 12px 15px;
            background: #1a1a2e;
            border: 1px solid rgba(245,158,11,0.3);
            border-radius: 8px;
            color: white;
            width: 250px;
        }

        .search-box select {
            padding: 12px 15px;
            background: #1a1a2e;
            border: 1px solid rgba(245,158,11,0.3);
            border-radius: 8px;
            color: white;
        }

        .table-container {
            overflow-x: auto;
            background: #1a1a2e;
            border-radius: 16px;
            border: 1px solid rgba(245,158,11,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 15px;
            background: rgba(245,158,11,0.1);
            color: #f59e0b;
            font-weight: 600;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        tr:hover td {
            background: rgba(245,158,11,0.05);
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .status-new { background: #f59e0b; color: #0f0f1a; }
        .status-contacted { background: #3b82f6; color: white; }
        .status-proposal { background: #8b5cf6; color: white; }
        .status-converted { background: #10b981; color: white; }
        .status-lost { background: #ef4444; color: white; }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid rgba(245,158,11,0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .icon-btn:hover {
            background: #f59e0b;
            color: #0f0f1a;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #f59e0b;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #a0a0c0;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #0f0f1a;
            border: 1px solid rgba(245,158,11,0.3);
            border-radius: 8px;
            color: white;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            display: none;
            z-index: 1000;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #a0a0c0;
        }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; text-align: center; }
            .action-bar { flex-direction: column; align-items: stretch; }
            .search-box { flex-direction: column; }
            .search-box input { width: 100%; }
            th, td { font-size: 12px; padding: 8px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Soft System<span>Solutions</span></div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='dashboard.html'">📊 Dashboard</button>
            <button class="nav-btn active">📞 CRM</button>
            <button class="nav-btn" onclick="window.location.href='search.html'">🔍 Business Search</button>
            <button class="nav-btn" onclick="window.location.href='proposals.html'">📄 Proposals</button>
            <button class="nav-btn" onclick="window.location.href='whatsapp.html'">💬 WhatsApp</button>
            <button class="nav-btn" onclick="window.location.href='settings.html'">⚙️ Settings</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="stats-grid" id="statsGrid"></div>

        <div class="action-bar">
            <div>
                <button class="btn-primary" onclick="openAddContactModal()">+ Add New Contact</button>
                <button class="btn-secondary" onclick="exportContacts()">📥 Export CSV</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by name, company, email..." onkeyup="loadContacts()">
                <select id="statusFilter" onchange="loadContacts()">
                    <option value="all">All Status</option>
                    <option value="new">New</option>
                    <option value="contacted">Contacted</option>
                    <option value="proposal">Proposal Sent</option>
                    <option value="converted">Converted</option>
                    <option value="lost">Lost</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Company</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="contactsTableBody">
                    <tr><td colspan="8" class="empty-state">Loading contacts...<\/td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Contact Modal -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Add New Contact</h3>
            <input type="hidden" id="contactId">
            <div class="form-group"><label>Full Name *</label><input type="text" id="contactName" placeholder="e.g., John Mensah"></div>
            <div class="form-group"><label>Company Name</label><input type="text" id="contactCompany" placeholder="e.g., ABC School"></div>
            <div class="form-group"><label>Email</label><input type="email" id="contactEmail" placeholder="email@example.com"></div>
            <div class="form-group"><label>Phone Number</label><input type="text" id="contactPhone" placeholder="+233 XX XXX XXXX"></div>
            <div class="form-group"><label>Category</label><select id="contactCategory"><option value="">Select Category</option><option value="School">🏫 School</option><option value="Hospital">🏥 Hospital</option><option value="Hotel">🏨 Hotel</option><option value="Restaurant">🍽️ Restaurant</option><option value="Business">💼 Business</option><option value="Other">📌 Other</option></select></div>
            <div class="form-group"><label>Status</label><select id="contactStatus"><option value="new">🆕 New</option><option value="contacted">📞 Contacted</option><option value="proposal">📄 Proposal Sent</option><option value="converted">✅ Converted</option><option value="lost">❌ Lost</option></select></div>
            <div class="form-group"><label>Address</label><textarea id="contactAddress" rows="2"></textarea></div>
            <div class="form-group"><label>Notes</label><textarea id="contactNotes" rows="3"></textarea></div>
            <div class="modal-buttons"><button class="btn-primary" onclick="saveContact()">Save Contact</button><button class="btn-secondary" onclick="closeModal('contactModal')">Cancel</button></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API_URL = '';
        let token = localStorage.getItem('token');
        let contacts = [];
        
        if (!token) window.location.href = 'index.html';

        async function apiCall(endpoint, options = {}) {
            const response = await fetch(API_URL + endpoint, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...options.headers
                }
            });
            return response.json();
        }

        async function loadContacts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            
            try {
                // Load from DATABASE, not localStorage
                contacts = await apiCall('/api/contacts');
                
                let filtered = contacts;
                if (search) filtered = filtered.filter(c => c.name.toLowerCase().includes(search) || (c.company && c.company.toLowerCase().includes(search)));
                if (statusFilter !== 'all') filtered = filtered.filter(c => c.status === statusFilter);
                
                renderContactsTable(filtered);
                updateStats(filtered);
            } catch (error) {
                console.error('Error loading contacts:', error);
                document.getElementById('contactsTableBody').innerHTML = '<tr><td colspan="8" class="empty-state">Error loading contacts. Please make sure server is running.<\/td></tr>';
            }
        }

        function renderContactsTable(contactsList) {
            const tbody = document.getElementById('contactsTableBody');
            if (contactsList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No contacts found. Click "+ Add New Contact" to get started.络<\/td></tr>';
                return;
            }
            
            tbody.innerHTML = contactsList.map(contact => `
                <tr>
                    <td><strong>${escapeHtml(contact.name)}</strong></td>
                    <td>${escapeHtml(contact.company || '-')}</td>
                    <td>${escapeHtml(contact.email || '-')}</td>
                    <td>${escapeHtml(contact.phone || '-')}</td>
                    <td>${escapeHtml(contact.category || '-')}</td>
                    <td><span class="status status-${contact.status || 'new'}">${getStatusText(contact.status)}</span></td>
                    <td>${formatDate(contact.created_at)}</span></td>
                    <td class="action-buttons">
                        <button class="icon-btn" onclick="editContact(${contact.id})">✏️ Edit</button>
                        <button class="icon-btn" onclick="deleteContact(${contact.id})">🗑️ Delete</button>
                    </span></td>
                </tr>
            `).join('');
        }

        function getStatusText(status) {
            const map = { 'new':'🆕 New', 'contacted':'📞 Contacted', 'proposal':'📄 Proposal Sent', 'converted':'✅ Converted', 'lost':'❌ Lost' };
            return map[status] || '🆕 New';
        }

        function updateStats(contactsList) {
            const total = contactsList.length;
            const converted = contactsList.filter(c => c.status === 'converted').length;
            const pending = contactsList.filter(c => c.status === 'new' || c.status === 'contacted').length;
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card"><div class="stat-number">${total}</div><div class="stat-label">Total Contacts</div></div>
                <div class="stat-card"><div class="stat-number">${converted}</div><div class="stat-label">Converted</div></div>
                <div class="stat-card"><div class="stat-number">${pending}</div><div class="stat-label">Pending</div></div>
            `;
        }

        function openAddContactModal() {
            document.getElementById('modalTitle').innerText = 'Add New Contact';
            document.getElementById('contactId').value = '';
            document.getElementById('contactName').value = '';
            document.getElementById('contactCompany').value = '';
            document.getElementById('contactEmail').value = '';
            document.getElementById('contactPhone').value = '';
            document.getElementById('contactCategory').value = '';
            document.getElementById('contactStatus').value = 'new';
            document.getElementById('contactAddress').value = '';
            document.getElementById('contactNotes').value = '';
            document.getElementById('contactModal').style.display = 'flex';
        }

        async function editContact(id) {
            const contact = contacts.find(c => c.id === id);
            if (!contact) return;
            document.getElementById('modalTitle').innerText = 'Edit Contact';
            document.getElementById('contactId').value = contact.id;
            document.getElementById('contactName').value = contact.name;
            document.getElementById('contactCompany').value = contact.company || '';
            document.getElementById('contactEmail').value = contact.email || '';
            document.getElementById('contactPhone').value = contact.phone || '';
            document.getElementById('contactCategory').value = contact.category || '';
            document.getElementById('contactStatus').value = contact.status || 'new';
            document.getElementById('contactAddress').value = contact.address || '';
            document.getElementById('contactNotes').value = contact.notes || '';
            document.getElementById('contactModal').style.display = 'flex';
        }

        async function saveContact() {
            const id = document.getElementById('contactId').value;
            const contactData = {
                name: document.getElementById('contactName').value,
                company: document.getElementById('contactCompany').value,
                email: document.getElementById('contactEmail').value,
                phone: document.getElementById('contactPhone').value,
                address: document.getElementById('contactAddress').value,
                category: document.getElementById('contactCategory').value,
                status: document.getElementById('contactStatus').value,
                notes: document.getElementById('contactNotes').value
            };
            
            if (!contactData.name) { showToast('Name is required', 'error'); return; }
            
            try {
                let response;
                if (id) {
                    response = await fetch(API_URL + `/api/contacts/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify(contactData)
                    });
                } else {
                    response = await fetch(API_URL + '/api/contacts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify(contactData)
                    });
                }
                
                if (response.ok) {
                    closeModal('contactModal');
                    await loadContacts();
                    showToast(id ? 'Contact updated!' : 'Contact added!', 'success');
                } else {
                    const error = await response.json();
                    showToast(error.error || 'Error saving contact', 'error');
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }

        async function deleteContact(id) {
            if (confirm('Delete this contact?')) {
                try {
                    await fetch(API_URL + `/api/contacts/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    await loadContacts();
                    showToast('Contact deleted!', 'success');
                } catch (error) {
                    showToast('Error deleting contact', 'error');
                }
            }
        }

        function exportContacts() {
            if (contacts.length === 0) { showToast('No contacts to export', 'error'); return; }
            const csv = [['Name','Company','Email','Phone','Category','Status','Address','Notes','Created Date'], ...contacts.map(c => [c.name, c.company || '', c.email || '', c.phone || '', c.category || '', c.status || 'new', c.address || '', c.notes || '', formatDate(c.created_at)])].map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `contacts_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Contacts exported!', 'success');
        }

        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }
        function showToast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.style.backgroundColor = type === 'error' ? '#ef4444' : '#10b981'; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
        function formatDate(d) { if (!d) return '-'; const date = new Date(d); return `${date.getDate()}/${date.getMonth()+1}/${date.getFullYear()}`; }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
        
        loadContacts();
    </script>
</body>
</html>
