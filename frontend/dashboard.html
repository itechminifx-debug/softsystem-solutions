<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Soft System Solutions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #0f0f1a;
            color: white;
        }

        .navbar {
            background: #1a1a2e;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid rgba(245,158,11,0.3);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            color: #f59e0b;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid rgba(245,158,11,0.3);
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .nav-btn:hover {
            background: #f59e0b;
            border-color: #f59e0b;
            color: #0f0f1a;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            color: #f59e0b;
            margin-bottom: 20px;
        }

        .welcome-card {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 20px;
            margin-top: 30px;
            border: 1px solid rgba(245,158,11,0.2);
        }

        .info {
            color: #a0a0c0;
            margin: 20px 0;
            line-height: 1.6;
        }

        .nav-buttons-main {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .main-btn {
            background: #f59e0b;
            color: #0f0f1a;
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.3s;
            text-align: center;
        }

        .main-btn:hover {
            transform: translateY(-3px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1a1a2e;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(245,158,11,0.2);
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #f59e0b;
        }

        .stat-label {
            font-size: 14px;
            color: #a0a0c0;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; text-align: center; }
            .nav-buttons-main { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Soft System<span>Solutions</span></div>
        <div class="nav-buttons">
            <button class="nav-btn" style="background:#f59e0b; color:#0f0f1a;">📊 Dashboard</button>
            <button class="nav-btn" onclick="window.location.href='crm.html'">📞 CRM</button>
            <button class="nav-btn" onclick="window.location.href='search.html'">🔍 Business Search</button>
            <button class="nav-btn" onclick="window.location.href='proposals.html'">📄 Proposals</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <h1>Welcome to Soft System Solutions</h1>
        
        <!-- Stats Section -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="stat-number">-</div><div class="stat-label">Total Contacts</div></div>
            <div class="stat-card"><div class="stat-number">-</div><div class="stat-label">Converted</div></div>
            <div class="stat-card"><div class="stat-number">-</div><div class="stat-label">Proposals</div></div>
            <div class="stat-card"><div class="stat-number">-</div><div class="stat-label">Accepted</div></div>
        </div>
        
        <div class="welcome-card">
            <p class="info">
                ✅ You have successfully logged in!<br><br>
                Your complete Business Intelligence & CRM System is ready.
            </p>
            
            <div class="nav-buttons-main">
                <button class="main-btn" onclick="window.location.href='crm.html'">📞 Go to CRM</button>
                <button class="main-btn" onclick="window.location.href='search.html'">🔍 Business Search</button>
                <button class="main-btn" onclick="window.location.href='proposals.html'">📄 Manage Proposals</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'index.html';
        }

        function loadStats() {
            const contacts = JSON.parse(localStorage.getItem('sss_contacts') || '[]');
            const proposals = JSON.parse(localStorage.getItem('sss_proposals') || '[]');
            
            const totalContacts = contacts.length;
            const converted = contacts.filter(c => c.status === 'converted').length;
            const totalProposals = proposals.length;
            const accepted = proposals.filter(p => p.status === 'accepted').length;
            
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card"><div class="stat-number">${totalContacts}</div><div class="stat-label">Total Contacts</div></div>
                <div class="stat-card"><div class="stat-number">${converted}</div><div class="stat-label">Converted</div></div>
                <div class="stat-card"><div class="stat-number">${totalProposals}</div><div class="stat-label">Proposals Sent</div></div>
                <div class="stat-card"><div class="stat-number">${accepted}</div><div class="stat-label">Accepted</div></div>
            `;
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        loadStats();
        
        // Refresh stats every 5 seconds
        setInterval(loadStats, 5000);
    </script>
</body>
</html>
