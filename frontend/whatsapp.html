<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Manager | Soft System Solutions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #0f0f1a;
            color: #ffffff;
        }

        .navbar {
            background: #1a1a2e;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid rgba(245,158,11,0.3);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            color: #f59e0b;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid rgba(245,158,11,0.3);
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn:hover, .nav-btn.active {
            background: #f59e0b;
            color: #0f0f1a;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(245,158,11,0.2);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #f59e0b;
        }

        .stat-label {
            font-size: 13px;
            color: #a0a0c0;
            margin-top: 5px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-primary {
            background: #25D366;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #25D366;
            color: #25D366;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            padding: 12px 15px;
            background: #1a1a2e;
            border: 1px solid rgba(37,211,102,0.3);
            border-radius: 8px;
            color: white;
            width: 250px;
        }

        .contacts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .contact-card {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(37,211,102,0.2);
            transition: all 0.3s;
        }

        .contact-card:hover {
            border-color: #25D366;
            transform: translateY(-3px);
        }

        .contact-name {
            font-size: 18px;
            font-weight: bold;
            color: #25D366;
            margin-bottom: 10px;
        }

        .contact-details {
            margin: 10px 0;
            font-size: 13px;
            color: #a0a0c0;
        }

        .contact-details div {
            margin: 5px 0;
        }

        .whatsapp-btn {
            background: #25D366;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .whatsapp-btn:hover {
            opacity: 0.9;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #25D366;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #a0a0c0;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            background: #0f0f1a;
            border: 1px solid rgba(37,211,102,0.3);
            border-radius: 8px;
            color: white;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #25D366;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            display: none;
            z-index: 1000;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #a0a0c0;
        }

        .template-chip {
            background: rgba(37,211,102,0.15);
            border: 1px solid rgba(37,211,102,0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            margin: 3px;
            display: inline-block;
        }

        .template-chip:hover {
            background: #25D366;
            color: #0f0f1a;
        }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; text-align: center; }
            .action-bar { flex-direction: column; align-items: stretch; }
            .search-box { flex-direction: column; }
            .search-box input { width: 100%; }
            .contacts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Soft System<span>Solutions</span></div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='dashboard.html'">📊 Dashboard</button>
            <button class="nav-btn" onclick="window.location.href='crm.html'">📞 CRM</button>
            <button class="nav-btn" onclick="window.location.href='search.html'">🔍 Business Search</button>
            <button class="nav-btn" onclick="window.location.href='proposals.html'">📄 Proposals</button>
            <button class="nav-btn active">💬 WhatsApp</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="stats-grid" id="statsGrid"></div>

        <div class="action-bar">
            <div>
                <button class="btn-primary" onclick="openBroadcastModal()">📢 Broadcast Message</button>
                <button class="btn-secondary" onclick="openTemplateModal()">📝 Message Templates</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search contacts..." onkeyup="loadContacts()">
                <select id="categoryFilter" onchange="loadContacts()">
                    <option value="all">All Categories</option>
                    <option value="School">🏫 Schools</option>
                    <option value="Hotel">🏨 Hotels</option>
                    <option value="Hospital">🏥 Hospitals</option>
                    <option value="Restaurant">🍽️ Restaurants</option>
                    <option value="Bank">🏦 Banks</option>
                    <option value="IT">💻 IT Companies</option>
                </select>
            </div>
        </div>

        <div class="contacts-grid" id="contactsGrid"></div>
    </div>

    <!-- Send WhatsApp Modal -->
    <div id="whatsappModal" class="modal">
        <div class="modal-content">
            <h3>💬 Send WhatsApp Message</h3>
            <input type="hidden" id="selectedContactId">
            <div class="form-group">
                <label>Contact Name</label>
                <input type="text" id="contactName" readonly>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="contactPhone" readonly>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea id="messageText" rows="5" placeholder="Type your message here..."></textarea>
            </div>
            <div class="form-group">
                <label>Quick Templates</label>
                <div id="templatesList"></div>
            </div>
            <div class="modal-buttons">
                <button class="btn-primary" onclick="sendWhatsAppMessage()">📤 Send</button>
                <button class="btn-secondary" onclick="closeModal('whatsappModal')">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Broadcast Modal -->
    <div id="broadcastModal" class="modal">
        <div class="modal-content">
            <h3>📢 Broadcast Message to Multiple Contacts</h3>
            <div class="form-group">
                <label>Select Recipients</label>
                <select id="broadcastFilter">
                    <option value="all">All Contacts</option>
                    <option value="School">🏫 Schools</option>
                    <option value="Hotel">🏨 Hotels</option>
                    <option value="Hospital">🏥 Hospitals</option>
                    <option value="Restaurant">🍽️ Restaurants</option>
                    <option value="Bank">🏦 Banks</option>
                    <option value="IT">💻 IT Companies</option>
                </select>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea id="broadcastMessage" rows="5" placeholder="Type your broadcast message here..."></textarea>
            </div>
            <div class="form-group">
                <label>Quick Templates</label>
                <div id="broadcastTemplatesList"></div>
            </div>
            <div class="modal-buttons">
                <button class="btn-primary" onclick="sendBroadcast()">📤 Send to All</button>
                <button class="btn-secondary" onclick="closeModal('broadcastModal')">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Templates Modal -->
    <div id="templateModal" class="modal">
        <div class="modal-content">
            <h3>📝 Message Templates</h3>
            <div class="form-group">
                <label>Template Name</label>
                <input type="text" id="templateName" placeholder="e.g., Introduction, Follow-up, Proposal">
            </div>
            <div class="form-group">
                <label>Template Message</label>
                <textarea id="templateMessage" rows="4" placeholder="Type your template message here..."></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn-primary" onclick="saveTemplate()">💾 Save Template</button>
                <button class="btn-secondary" onclick="closeModal('templateModal')">Cancel</button>
            </div>
            <div style="margin-top: 20px;">
                <h4>Saved Templates</h4>
                <div id="savedTemplatesList"></div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let contacts = [];
        let templates = [];
        let token = localStorage.getItem('token');
        
        if (!token) {
            window.location.href = 'index.html';
        }

        // Load contacts from localStorage
        function loadContacts() {
            contacts = JSON.parse(localStorage.getItem('sss_contacts') || '[]');
            templates = JSON.parse(localStorage.getItem('sss_whatsapp_templates') || '[]');
            
            const search = document.getElementById('searchInput').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value;
            
            let filtered = contacts.filter(c => c.phone && c.phone !== '');
            
            if (search) {
                filtered = filtered.filter(c => 
                    c.name.toLowerCase().includes(search) || 
                    (c.company && c.company.toLowerCase().includes(search))
                );
            }
            
            if (categoryFilter !== 'all') {
                filtered = filtered.filter(c => c.category === categoryFilter);
            }
            
            renderContacts(filtered);
            updateStats();
        }

        function renderContacts(contactsList) {
            const grid = document.getElementById('contactsGrid');
            
            if (contactsList.length === 0) {
                grid.innerHTML = '<div class="empty-state">📭 No contacts with phone numbers found. Add contacts in CRM first.</div>';
                return;
            }
            
            grid.innerHTML = contactsList.map(contact => `
                <div class="contact-card">
                    <div class="contact-name">${escapeHtml(contact.name)}</div>
                    <div class="contact-details">
                        <div>🏢 ${escapeHtml(contact.company || 'No company')}</div>
                        <div>📂 ${escapeHtml(contact.category || 'Uncategorized')}</div>
                        <div>📍 ${escapeHtml(contact.address || 'No address')}</div>
                        <div>📞 ${escapeHtml(contact.phone || 'No phone')}</div>
                    </div>
                    <button class="whatsapp-btn" onclick="openWhatsAppModal(${contact.id})">
                        💬 Send WhatsApp Message
                    </button>
                </div>
            `).join('');
        }

        function updateStats() {
            const totalWithPhone = contacts.filter(c => c.phone && c.phone !== '').length;
            const schools = contacts.filter(c => c.category === 'School' && c.phone).length;
            const hotels = contacts.filter(c => c.category === 'Hotel' && c.phone).length;
            const hospitals = contacts.filter(c => c.category === 'Hospital' && c.phone).length;
            
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card"><div class="stat-number">${totalWithPhone}</div><div class="stat-label">Contacts with Phone</div></div>
                <div class="stat-card"><div class="stat-number">${schools}</div><div class="stat-label">Schools</div></div>
                <div class="stat-card"><div class="stat-number">${hotels}</div><div class="stat-label">Hotels</div></div>
                <div class="stat-card"><div class="stat-number">${hospitals}</div><div class="stat-label">Hospitals</div></div>
            `;
        }

        function openWhatsAppModal(contactId) {
            const contact = contacts.find(c => c.id === contactId);
            if (!contact) return;
            
            if (!contact.phone || contact.phone === '') {
                showToast('No phone number found for this contact', 'error');
                return;
            }
            
            document.getElementById('selectedContactId').value = contactId;
            document.getElementById('contactName').value = contact.name;
            document.getElementById('contactPhone').value = contact.phone;
            document.getElementById('messageText').value = getTemplateMessage('introduction', contact.name);
            
            // Load templates
            const templatesList = document.getElementById('templatesList');
            templatesList.innerHTML = templates.map(t => 
                `<span class="template-chip" onclick="useTemplate('${t.message.replace(/'/g, "\\'")}')">📝 ${t.name}</span>`
            ).join('');
            
            document.getElementById('whatsappModal').style.display = 'flex';
        }

        function useTemplate(message) {
            document.getElementById('messageText').value = message;
        }

        function getTemplateMessage(templateName, contactName) {
            const templates = {
                'introduction': `Hello ${contactName},\n\nI hope this message finds you well.\n\nI'm reaching out from Soft System Solutions. We specialize in business software solutions including School Management Systems, CRM, and digital transformation.\n\nWould you be open to a quick chat about how we can help your business?\n\nBest regards,\nElijah\nSoft System Solutions`,
                'followup': `Hello ${contactName},\n\nFollowing up on my previous message. I'd love to schedule a quick call to discuss how we can help streamline your operations.\n\nWhen would be a good time to connect?\n\nBest regards,\nElijah\nSoft System Solutions`,
                'proposal': `Hello ${contactName},\n\nI've prepared a proposal outlining how our software solutions can benefit your organization.\n\nPlease let me know when you can review it.\n\nBest regards,\nElijah\nSoft System Solutions`
            };
            return templates[templateName] || '';
        }

        function sendWhatsAppMessage() {
            const contactId = document.getElementById('selectedContactId').value;
            const contact = contacts.find(c => c.id == contactId);
            const message = document.getElementById('messageText').value;
            
            if (!message) {
                showToast('Please enter a message', 'error');
                return;
            }
            
            let phone = contact.phone.replace(/[^0-9]/g, '');
            if (phone.startsWith('0')) {
                phone = '233' + phone.substring(1);
            }
            if (!phone.startsWith('233')) {
                phone = '233' + phone;
            }
            
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${phone}?text=${encodedMessage}`, '_blank');
            
            // Log the message
            logMessage(contact.id, contact.name, message);
            
            closeModal('whatsappModal');
            showToast(`Opening WhatsApp for ${contact.name}...`, 'success');
        }

        function openBroadcastModal() {
            document.getElementById('broadcastMessage').value = getTemplateMessage('introduction', '[Name]');
            
            const templatesList = document.getElementById('broadcastTemplatesList');
            templatesList.innerHTML = templates.map(t => 
                `<span class="template-chip" onclick="useBroadcastTemplate('${t.message.replace(/'/g, "\\'")}')">📝 ${t.name}</span>`
            ).join('');
            
            document.getElementById('broadcastModal').style.display = 'flex';
        }

        function useBroadcastTemplate(message) {
            document.getElementById('broadcastMessage').value = message;
        }

        function sendBroadcast() {
            const filter = document.getElementById('broadcastFilter').value;
            let message = document.getElementById('broadcastMessage').value;
            
            let recipients = contacts;
            if (filter !== 'all') {
                recipients = contacts.filter(c => c.category === filter);
            }
            
            recipients = recipients.filter(c => c.phone && c.phone !== '');
            
            if (recipients.length === 0) {
                showToast('No recipients found', 'error');
                return;
            }
            
            if (!message) {
                showToast('Please enter a message', 'error');
                return;
            }
            
            // Open WhatsApp for first contact (user can continue manually)
            const firstContact = recipients[0];
            let phone = firstContact.phone.replace(/[^0-9]/g, '');
            if (phone.startsWith('0')) phone = '233' + phone.substring(1);
            if (!phone.startsWith('233')) phone = '233' + phone;
            
            const personalizedMessage = message.replace('[Name]', firstContact.name);
            const encodedMessage = encodeURIComponent(personalizedMessage);
            window.open(`https://wa.me/${phone}?text=${encodedMessage}`, '_blank');
            
            showToast(`Opening WhatsApp for first contact. You have ${recipients.length} contacts to message.`, 'info');
            closeModal('broadcastModal');
        }

        function openTemplateModal() {
            loadTemplatesList();
            document.getElementById('templateModal').style.display = 'flex';
        }

        function saveTemplate() {
            const name = document.getElementById('templateName').value.trim();
            const message = document.getElementById('templateMessage').value.trim();
            
            if (!name || !message) {
                showToast('Please enter template name and message', 'error');
                return;
            }
            
            templates.push({
                id: templates.length + 1,
                name: name,
                message: message,
                createdAt: new Date().toISOString()
            });
            
            localStorage.setItem('sss_whatsapp_templates', JSON.stringify(templates));
            
            document.getElementById('templateName').value = '';
            document.getElementById('templateMessage').value = '';
            
            loadTemplatesList();
            showToast('Template saved!', 'success');
        }

        function loadTemplatesList() {
            const container = document.getElementById('savedTemplatesList');
            if (templates.length === 0) {
                container.innerHTML = '<p style="color:#a0a0c0;">No templates yet. Create one above.</p>';
                return;
            }
            
            container.innerHTML = templates.map(t => `
                <div style="background:#0f0f1a; padding:10px; margin-bottom:10px; border-radius:8px;">
                    <strong>${escapeHtml(t.name)}</strong>
                    <button class="btn-secondary" style="padding:4px 8px; margin-left:10px;" onclick="editTemplate(${t.id})">Edit</button>
                    <button class="btn-secondary" style="padding:4px 8px; background:#ef4444; border-color:#ef4444;" onclick="deleteTemplate(${t.id})">Delete</button>
                    <div style="font-size:12px; color:#64748b; margin-top:5px;">${escapeHtml(t.message.substring(0, 100))}...</div>
                </div>
            `).join('');
        }

        function editTemplate(id) {
            const template = templates.find(t => t.id === id);
            if (template) {
                document.getElementById('templateName').value = template.name;
                document.getElementById('templateMessage').value = template.message;
                deleteTemplate(id);
            }
        }

        function deleteTemplate(id) {
            templates = templates.filter(t => t.id !== id);
            localStorage.setItem('sss_whatsapp_templates', JSON.stringify(templates));
            loadTemplatesList();
            showToast('Template deleted', 'success');
        }

        function logMessage(contactId, contactName, message) {
            let logs = JSON.parse(localStorage.getItem('sss_whatsapp_logs') || '[]');
            logs.push({
                id: logs.length + 1,
                contact_id: contactId,
                contact_name: contactName,
                message: message.substring(0, 100),
                date: new Date().toISOString()
            });
            localStorage.setItem('sss_whatsapp_logs', JSON.stringify(logs));
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.backgroundColor = type === 'error' ? '#ef4444' : '#25D366';
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Initialize
        loadContacts();
    </script>
</body>
</html>
