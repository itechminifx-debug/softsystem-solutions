<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Manager | Soft System Solutions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0f0f1a; color: #ffffff; }
        .navbar { background: #1a1a2e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border-bottom: 1px solid rgba(245,158,11,0.3); }
        .logo { font-size: 22px; font-weight: bold; }
        .logo span { color: #f59e0b; }
        .nav-buttons { display: flex; gap: 15px; flex-wrap: wrap; }
        .nav-btn { background: transparent; border: 1px solid rgba(245,158,11,0.3); color: white; padding: 8px 20px; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .nav-btn:hover, .nav-btn.active { background: #f59e0b; color: #0f0f1a; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1a1a2e; padding: 20px; border-radius: 16px; text-align: center; border: 1px solid rgba(245,158,11,0.2); }
        .stat-number { font-size: 32px; font-weight: bold; color: #f59e0b; }
        .stat-label { font-size: 13px; color: #a0a0c0; margin-top: 5px; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
        .btn-primary { background: #25D366; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-secondary { background: transparent; border: 1px solid #25D366; color: #25D366; padding: 12px 24px; border-radius: 8px; cursor: pointer; }
        .search-box { display: flex; gap: 10px; }
        .search-box input { padding: 12px 15px; background: #1a1a2e; border: 1px solid rgba(37,211,102,0.3); border-radius: 8px; color: white; width: 250px; }
        .contacts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .contact-card { background: #1a1a2e; border-radius: 16px; padding: 20px; border: 1px solid rgba(37,211,102,0.2); transition: all 0.3s; }
        .contact-card:hover { border-color: #25D366; transform: translateY(-3px); }
        .contact-name { font-size: 18px; font-weight: bold; color: #25D366; margin-bottom: 10px; }
        .contact-details { margin: 10px 0; font-size: 13px; color: #a0a0c0; }
        .whatsapp-btn { background: #25D366; color: white; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1a1a2e; border-radius: 20px; padding: 30px; width: 90%; max-width: 500px; }
        .modal-content h3 { margin-bottom: 20px; color: #25D366; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #a0a0c0; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; background: #0f0f1a; border: 1px solid rgba(37,211,102,0.3); border-radius: 8px; color: white; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #25D366; color: white; padding: 12px 24px; border-radius: 8px; display: none; z-index: 1000; }
        .empty-state { text-align: center; padding: 60px; color: #a0a0c0; grid-column: 1/-1; }
        .template-chip { background: rgba(37,211,102,0.15); border: 1px solid rgba(37,211,102,0.3); padding: 6px 12px; border-radius: 20px; font-size: 11px; cursor: pointer; margin: 3px; display: inline-block; }
        @media (max-width: 768px) { .navbar { flex-direction: column; text-align: center; } .action-bar { flex-direction: column; align-items: stretch; } .search-box { flex-direction: column; } .search-box input { width: 100%; } .contacts-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Soft System<span>Solutions</span></div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='dashboard.html'">📊 Dashboard</button>
            <button class="nav-btn" onclick="window.location.href='crm.html'">📞 CRM</button>
            <button class="nav-btn" onclick="window.location.href='search.html'">🔍 Business Search</button>
            <button class="nav-btn" onclick="window.location.href='proposals.html'">📄 Proposals</button>
            <button class="nav-btn active">💬 WhatsApp</button>
            <button class="nav-btn" onclick="window.location.href='settings.html'">⚙️ Settings</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="stats-grid" id="statsGrid"></div>
        <div class="action-bar">
            <button class="btn-primary" onclick="openBroadcastModal()">📢 Broadcast Message</button>
            <div class="search-box"><input type="text" id="searchInput" placeholder="Search contacts..." onkeyup="loadContacts()"></div>
        </div>
        <div class="contacts-grid" id="contactsGrid"><div class="empty-state">Loading contacts...<\/div></div>
    </div>

    <div id="whatsappModal" class="modal"><div class="modal-content"><h3>💬 Send WhatsApp Message</h3><input type="hidden" id="selectedContactId"><div class="form-group"><label>Contact Name</label><input type="text" id="contactName" readonly></div><div class="form-group"><label>Phone Number</label><input type="text" id="contactPhone" readonly></div><div class="form-group"><label>Message</label><textarea id="messageText" rows="5"></textarea></div><div class="modal-buttons"><button class="btn-primary" onclick="sendWhatsAppMessage()">📤 Send</button><button class="btn-secondary" onclick="closeModal('whatsappModal')">Cancel</button></div></div></div>

    <div id="broadcastModal" class="modal"><div class="modal-content"><h3>📢 Broadcast Message</h3><div class="form-group"><label>Message</label><textarea id="broadcastMessage" rows="5"></textarea></div><div class="modal-buttons"><button class="btn-primary" onclick="sendBroadcast()">📤 Send to All</button><button class="btn-secondary" onclick="closeModal('broadcastModal')">Cancel</button></div></div></div>

    <div id="toast" class="toast"></div>

    <script>
        const API_URL = ''; let token = localStorage.getItem('token'); let contacts = [];
        if (!token) window.location.href = 'index.html';
        async function apiCall(endpoint) { const r = await fetch(API_URL + endpoint, { headers: { 'Authorization': `Bearer ${token}` } }); return r.json(); }
        async function loadContacts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            contacts = await apiCall('/api/contacts');
            let filtered = contacts.filter(c => c.phone && c.phone !== '');
            if (search) filtered = filtered.filter(c => c.name.toLowerCase().includes(search));
            renderContacts(filtered);
            updateStats(filtered);
        }
        function renderContacts(list) {
            const grid = document.getElementById('contactsGrid');
            if (list.length === 0) { grid.innerHTML = '<div class="empty-state">📭 No contacts with phone numbers found. Add contacts in CRM first.<\/div>'; return; }
            grid.innerHTML = list.map(c => `<div class="contact-card"><div class="contact-name">${escapeHtml(c.name)}</div><div class="contact-details"><div>🏢 ${escapeHtml(c.company || 'No company')}</div><div>📞 ${escapeHtml(c.phone)}</div></div><button class="whatsapp-btn" onclick="openWhatsAppModal(${c.id})">💬 Send WhatsApp Message</button></div>`).join('');
        }
        function updateStats(list) { document.getElementById('statsGrid').innerHTML = `<div class="stat-card"><div class="stat-number">${list.length}</div><div class="stat-label">Contacts with Phone</div></div>`; }
        function openWhatsAppModal(id) { const c = contacts.find(c => c.id === id); if (!c || !c.phone) { showToast('No phone number', 'error'); return; } document.getElementById('selectedContactId').value = id; document.getElementById('contactName').value = c.name; document.getElementById('contactPhone').value = c.phone; document.getElementById('messageText').value = `Hello ${c.name},\n\nI hope this message finds you well.\n\nBest regards,\nSoft System Solutions`; document.getElementById('whatsappModal').style.display = 'flex'; }
        function sendWhatsAppMessage() { const c = contacts.find(c => c.id == document.getElementById('selectedContactId').value); const msg = document.getElementById('messageText').value; if (!msg) { showToast('Enter message', 'error'); return; } let phone = c.phone.replace(/[^0-9]/g, ''); if (phone.startsWith('0')) phone = '233' + phone.substring(1); if (!phone.startsWith('233')) phone = '233' + phone; window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank'); closeModal('whatsappModal'); showToast(`Opening WhatsApp for ${c.name}...`, 'success'); }
        function openBroadcastModal() { document.getElementById('broadcastMessage').value = 'Hello,\n\nI hope this message finds you well.\n\nBest regards,\nSoft System Solutions'; document.getElementById('broadcastModal').style.display = 'flex'; }
        function sendBroadcast() { const msg = document.getElementById('broadcastMessage').value; if (!msg) { showToast('Enter message', 'error'); return; } const recipients = contacts.filter(c => c.phone); if (recipients.length === 0) { showToast('No contacts with phone numbers', 'error'); return; } let phone = recipients[0].phone.replace(/[^0-9]/g, ''); if (phone.startsWith('0')) phone = '233' + phone.substring(1); if (!phone.startsWith('233')) phone = '233' + phone; window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank'); closeModal('broadcastModal'); showToast(`Opening WhatsApp for first contact. You have ${recipients.length} contacts.`, 'info'); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function showToast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.style.backgroundColor = type === 'error' ? '#ef4444' : '#25D366'; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
        loadContacts();
    </script>
</body>
</html>
