<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Soft System Solutions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 1px solid rgba(245,158,11,0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            color: white;
        }

        .logo span {
            color: #f59e0b;
        }

        .logo p {
            color: #a0a0c0;
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #a0a0c0;
            font-size: 13px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: #0f0f1a;
            border: 1px solid rgba(245,158,11,0.3);
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f59e0b;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #f59e0b;
            color: #0f0f1a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .message {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
        }

        .error {
            color: #ef4444;
        }

        .success {
            color: #10b981;
        }

        .credentials {
            margin-top: 25px;
            padding: 15px;
            background: rgba(245,158,11,0.1);
            border-radius: 8px;
            text-align: center;
        }

        .credentials p {
            color: #a0a0c0;
            font-size: 12px;
            margin: 5px 0;
        }

        .credentials strong {
            color: #f59e0b;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Soft System <span>Solutions</span></h1>
            <p>Business Intelligence & CRM System</p>
        </div>

        <div class="form-group">
            <label>Username or Email</label>
            <input type="text" id="username" placeholder="Enter your username or email">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>

        <button class="login-btn" onclick="login()">Login</button>

        <div id="message" class="message"></div>

        <div class="credentials">
            <p>🔐 <strong>Login Credentials</strong></p>
            <p>Username: <strong>admin</strong></p>
            <p>Password: <strong>admin123</strong></p>
        </div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            if (!username || !password) {
                messageDiv.innerHTML = '<p class="error">❌ Please enter username and password</p>';
                return;
            }
            
            messageDiv.innerHTML = '<p>⏳ Logging in...</p>';
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                console.log('Response:', data);
                
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    messageDiv.innerHTML = '<p class="success">✅ Login successful! Redirecting...</p>';
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    messageDiv.innerHTML = '<p class="error">❌ ' + data.message + '</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                messageDiv.innerHTML = '<p class="error">❌ Cannot connect to server. Make sure the server is running on port 3000.</p>';
            }
        }

        // Press Enter to login
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
